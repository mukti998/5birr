# 5BIRR Flutter CI Pipeline
name: Flutter CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  flutter-pub-get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold missing platform directories
        run: flutter create --platforms=android,ios .

      - name: Commit platform scaffolding if generated
        run: |
          if [ -z "$(git status --porcelain android/ ios/)" ]; then
            echo "No new platform files — skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/ ios/
            git commit -m "chore: scaffold missing android/ios platform directories via flutter create"
            git push
          fi

      - name: Inject Supabase env vars
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze
        continue-on-error: true

      - name: Commit pubspec.lock if changed
        run: |
          if [ -z "$(git status --porcelain pubspec.lock)" ]; then
            echo "pubspec.lock unchanged — skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pubspec.lock
            git commit -m "ci: auto-generate pubspec.lock"
            git push
          fi

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
