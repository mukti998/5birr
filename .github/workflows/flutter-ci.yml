# 5BIRR Flutter CI Pipeline — debug + release builds
name: Flutter CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  flutter-pub-get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold missing platform directories
        run: flutter create --platforms=android,ios .

      - name: Commit platform scaffolding if generated
        run: |
          if [ -z "$(git status --porcelain android/ ios/)" ]; then
            echo "No new platform files — skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/ ios/
            git commit -m "chore: scaffold missing android/ios platform directories via flutter create"
            git push
          fi

      - name: Inject Supabase env vars
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze
        continue-on-error: true

      - name: Commit pubspec.lock if changed
        run: |
          if [ -z "$(git status --porcelain pubspec.lock)" ]; then
            echo "pubspec.lock unchanged — skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pubspec.lock
            git commit -m "ci: auto-generate pubspec.lock"
            git push
          fi

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      # === Debug: check which secrets are set ===
      - name: Debug secret availability
        env:
          KPW: ${{ secrets.KEYSTORE_PASSWORD }}
          KPW2: ${{ secrets.KEY_PASSWORD }}
          SU: ${{ secrets.SUPABASE_URL }}
        run: |
          echo "KEYSTORE_PASSWORD length: ${#KPW}"
          echo "KEY_PASSWORD length: ${#KPW2}"
          echo "SUPABASE_URL length: ${#SU}"
          echo "Keystore file exists: $(test -f android/app/release-keystore.p12 && echo yes || echo no)"
          if [ -n "$KPW" ] && [ -f android/app/release-keystore.p12 ]; then
            echo "RELEASE_READY=true" >> "$GITHUB_ENV"
          fi

      # === Release Bundle Build ===
      # Keystore file is committed to the repo (password-protected).
      # Only the passwords are GitHub secrets — no base64 encoding needed.
      - name: Build release app bundle
        if: env.RELEASE_READY == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: fivebirr
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload release AAB artifact
        if: env.RELEASE_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

